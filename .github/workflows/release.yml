name: Release

on:
  push:
    tags: ['v*']

jobs:
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            **Download AI Pulse on the [Mac App Store](https://apps.apple.com/us/app/ai-pulse/id6786290416?mt=12).**

            Prefer the App Store for automatic updates and sandbox security. Source code is available here for inspection and building.
