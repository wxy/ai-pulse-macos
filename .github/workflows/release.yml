name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Preserve or create release draft
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # Pinned to the v5.0.0 commit — tag refs are movable.
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Preserve existing release or create draft from checked-in notes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/create-release-draft.py
