name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-analysis:
    name: Static analysis
    runs-on: ubuntu-latest

    steps:
      # Pinned to the v5.0.0 commit — tag refs are movable.
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Parse Swift sources
        run: |
          find Sources Tests Packages/AIPulseShared/Sources Suites AIPulse/AIPulseMacWidget -type f -name '*.swift' -print0 |
            xargs -0 -n1 swiftc -parse

      - name: Validate localizations
        run: python3 scripts/check-localizations.py

      - name: Check shell syntax
        run: |
          find scripts -type f -name '*.sh' -print0 |
            xargs -0 -n1 bash -n

      - name: Check Python syntax
        run: python3 -m py_compile scripts/generate-icons.py scripts/check-localizations.py

      - name: Validate workflow YAML
        run: |
          ruby -e 'require "yaml"; Dir[".github/workflows/*.{yml,yaml}"].sort.each { |file| YAML.parse_file(file); puts "checked #{file}" }'

  tests:
    name: Tests (macOS)
    # Pinned to the macos-26 image: the sources are developed against the
    # current SDK (Xcode 26/27), where the notification/image types carry the
    # concurrency annotations Swift 6 mode expects; the older macos-15 SDK
    # flags them as errors. macos-latest would migrate under our feet.
    runs-on: macos-26

    steps:
      # Pinned to the v5.0.0 commit — tag refs are movable.
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      # Package.swift bakes the vendored libgit2/zstd search paths and the
      # libgit2 rpath into the manifest itself, so a plain `swift test` is
      # enough; the four real-data tests skip themselves without their env.
      - name: Run package tests
        run: swift test
