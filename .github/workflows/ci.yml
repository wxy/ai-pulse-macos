name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Run tests
        run: |
          # Build main + test targets without executing (libgit2 rpath
          # must be fixed on the test binary before it can run).
          swift build --build-tests

          # SPM's @rpath doesn't resolve for xctest bundles — inject the
          # absolute path to libgit2 before execution.
          BIN_DIR=$(swift build --show-bin-path)
          TEST_BIN="$BIN_DIR/AIPulsePackageTests.xctest/Contents/MacOS/AIPulsePackageTests"
          install_name_tool -add_rpath "$(pwd)/Libraries/libgit2/lib" "$TEST_BIN"

          # Run tests without rebuilding.
          swift test --skip-build
