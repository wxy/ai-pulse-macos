name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-analysis:
    name: Static analysis
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Parse Swift sources
        run: |
          find Sources Tests Packages/AIPulseShared/Sources -type f -name '*.swift' -print0 |
            xargs -0 swiftc -parse

      - name: Check shell syntax
        run: |
          find scripts -type f -name '*.sh' -print0 |
            xargs -0 -n1 bash -n

      - name: Check Python syntax
        run: python3 -m py_compile scripts/generate-icons.py

      - name: Validate workflow YAML
        run: |
          ruby -e 'require "yaml"; Dir[".github/workflows/*.{yml,yaml}"].sort.each { |file| YAML.parse_file(file); puts "checked #{file}" }'
