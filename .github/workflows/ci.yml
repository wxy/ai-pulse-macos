name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: swift build

      - name: Run tests
        run: |
          # The test binary links libgit2.1.9.dylib via @rpath.
          # SPM's default rpath does not resolve for xctest bundles,
          # so add the absolute library path before running tests.
          BIN_DIR=$(swift build --show-bin-path)
          TEST_BIN="$BIN_DIR/AIPulsePackageTests.xctest/Contents/MacOS/AIPulsePackageTests"
          install_name_tool -add_rpath "$(pwd)/Libraries/libgit2/lib" "$TEST_BIN"
          swift test --skip-build
