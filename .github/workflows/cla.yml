name: CLA Assistant

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  CLAAssistant:
    name: CLA Assistant
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          # In-repo signatures on an unprotected main only need the default
          # token. If main is ever protected, add a PERSONAL_ACCESS_TOKEN
          # secret (repo-scoped PAT) and set it here.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: 'https://raw.githubusercontent.com/wxy/ai-pulse-macos/main/CLA.md'
          path-to-signatures: '.github/signatures/v1/cla.json'
          branch: 'main'
          # Owner and bots are exempt — the owner already holds full rights
          # to the project and does not need to sign.
          allowlist: 'wxy,dependabot[bot],renovate[bot]'
          custom-notsigned-prcomment: 'Thanks for contributing to AI Pulse! Before we can merge, please sign the Contributor License Agreement (CLA) by commenting on this PR with the sign phrase below. The full agreement is in [CLA.md](https://github.com/wxy/ai-pulse-macos/blob/main/CLA.md).'
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
          custom-allsigned-prcomment: 'All contributors have signed the CLA. Thank you!'
          lock-pullrequest-aftermerge: true
